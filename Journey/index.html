<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deen Journey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
  
  <style>
    :root { --bg: #000; --gold: #FFD700; }
    body { margin: 0; background: var(--bg); overflow: hidden; font-family: 'Inter', sans-serif; }
    #canvas-container { position: fixed; inset: 0; z-index: 0; }
    
    #scroll-proxy {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      overflow-y: auto; overflow-x: hidden; z-index: 10;
      scroll-behavior: smooth;
    }
    #scroll-content { height: 600vh; } 

    .label-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    
    .node-label {
      position: absolute; transform: translate(-50%, -100%);
      text-align: center; opacity: 0; transition: opacity 0.4s ease-out;
      /* Mobile-friendly width */
      width: 90vw; 
      max-width: 400px;
      pointer-events: auto; 
      /* REDUCED GAP: Portal much closer to text */
      padding-bottom: 25px; 
    }
    .node-label.visible { opacity: 1; transform: translate(-50%, -100%) scale(1); }
    
    .title { 
      font-family: 'Cormorant Garamond', serif; 
      color: #FFFFFF; 
      /* Mobile-friendly size */
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 700;
      letter-spacing: -0.5px; 
      line-height: 1.1;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }
    .sub { 
      font-family: 'Inter', sans-serif; 
      font-size: clamp(9px, 2vw, 11px);
      color: #FFD700; 
      text-transform: uppercase; 
      letter-spacing: 3px; 
      font-weight: 500; 
      margin-bottom: 6px; 
      display: inline-block;
      border-bottom: 1px solid rgba(255, 215, 0, 0.4); 
      padding-bottom: 3px;
    }
  </style>

  <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="label-container" id="labels"></div>
  <div id="scroll-proxy"><div id="scroll-content"></div></div>

  <script type="module">
    import * as THREE from 'three';

    // 1. SETUP
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.02); 
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. STARS
    const starCount = 5000;
    const starGeo = new THREE.BufferGeometry();
    const pos = new Float32Array(starCount*3);
    const blink = new Float32Array(starCount);
    for(let i=0; i<starCount; i++) {
      pos[i*3] = (Math.random()-0.5)*200;
      pos[i*3+1] = (Math.random()-0.5)*200; 
      pos[i*3+2] = (Math.random()-0.5)*100;
      blink[i] = Math.random()*10;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    starGeo.setAttribute('blink', new THREE.BufferAttribute(blink, 1));
    const starMat = new THREE.ShaderMaterial({
      uniforms: { time: { value: 0 } },
      vertexShader: `
        attribute float blink; varying float vAlpha; uniform float time;
        void main() {
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mvPosition;
          gl_PointSize = (3.0 / -mvPosition.z);
          vAlpha = 0.4 + 0.6 * sin(time * 0.5 + blink);
        }
      `,
      fragmentShader: `varying float vAlpha; void main() { if(distance(gl_PointCoord, vec2(0.5))>0.5) discard; gl_FragColor = vec4(1.0,1.0,1.0,vAlpha); }`,
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    });
    scene.add(new THREE.Points(starGeo, starMat));


    // 3. GLOWING HELIX (Shader-Based Glow, Fewer Particles)
    const particleCount = 40000; // REDUCED from 120k
    const helixGeo = new THREE.BufferGeometry();
    const hPos = new Float32Array(particleCount*3);
    const hOffset = new Float32Array(particleCount);
    const hDistance = new Float32Array(particleCount); // Distance from core for glow
    
    const helixRadius = 3.5;  
    const tubeRadius = 2.5; 
    const height = 60;
    const turns = 5;
    
    for(let i=0; i<particleCount; i++) {
      const t = i / particleCount; 
      const angle = t * Math.PI * 2 * turns;
      const coreX = Math.cos(angle) * helixRadius;
      const coreY = (t * height) - 4; 
      const coreZ = Math.sin(angle) * helixRadius;
      
      const power = 3.5; 
      let rRandom = Math.pow(Math.random(), power) * tubeRadius;
      
      // Irregular outer particles
      if(Math.random() > 0.9) {
        rRandom = tubeRadius * (0.8 + Math.random() * 0.7);
      }
      
      const thetaOffset = Math.random() * Math.PI * 2;
      
      hPos[i*3] = coreX + Math.cos(thetaOffset) * rRandom;
      hPos[i*3+1] = coreY + (Math.random()-0.5) * rRandom * 0.4; 
      hPos[i*3+2] = coreZ + Math.sin(thetaOffset) * rRandom;
      
      hOffset[i] = Math.random() * 10;
      hDistance[i] = rRandom / tubeRadius; // Normalized distance (0=core, 1=edge)
    }
    
    helixGeo.setAttribute('position', new THREE.BufferAttribute(hPos, 3));
    helixGeo.setAttribute('offset', new THREE.BufferAttribute(hOffset, 1));
    helixGeo.setAttribute('distance', new THREE.BufferAttribute(hDistance, 1));
    
    const helixMat = new THREE.ShaderMaterial({
      uniforms: { 
        time: { value: 0 }, 
        color: { value: new THREE.Color(0xFFD700) } 
      },
      vertexShader: `
        attribute float offset; 
        attribute float distance; 
        varying float vAlpha; 
        varying float vDist;
        uniform float time;
        
        void main() {
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mvPosition;
          
          vDist = distance;
          
          // GLOW EFFECT: Larger particles with soft edges
          // Core particles are bigger and brighter
          float sizeMultiplier = 1.5 + (1.0 - distance) * 2.0; // Core is 3.5x, edge is 1.5x
          gl_PointSize = (6.0 * sizeMultiplier / -mvPosition.z); 
          
          float shimmer = sin(time * 2.0 + offset);
          // Brighter core, dimmer edges
          vAlpha = (0.8 - distance * 0.5) + 0.2 * shimmer; 
        }
      `,
      fragmentShader: `
        uniform vec3 color; 
        varying float vAlpha;
        varying float vDist;
        
        void main() {
          float d = distance(gl_PointCoord, vec2(0.5));
          if(d > 0.5) discard; 
          
          // SOFT RADIAL GLOW (no hard edges)
          // Core particles have softer falloff
          float glowFalloff = mix(0.05, 0.3, vDist); // Core=0.05, Edge=0.3
          float glow = 1.0 - smoothstep(glowFalloff, 0.5, d);
          
          gl_FragColor = vec4(color, vAlpha * glow);
        }
      `,
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    });
    scene.add(new THREE.Points(helixGeo, helixMat));


    // 4. ROUND SPARK PORTAL
    const nodeData = [
      { t: "The Awakening", s: "Tawhid" },
      { t: "The Pact", s: "Al-Mithaq" },
      { t: "The Message", s: "Risalah" },
      { t: "The Connection", s: "Salah" },
      { t: "The Return", s: "Akhirah" }
    ];

    const nodes = [];

    function createRoundSparkTexture() {
      const c = document.createElement('canvas'); c.width=64; c.height=64;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(32,32,0,32,32,32);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.2, 'rgba(255,230,150,1)'); 
      g.addColorStop(0.5, 'rgba(255,180,80,0.6)');
      g.addColorStop(1, 'rgba(255,100,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
      return new THREE.CanvasTexture(c);
    }
    const sparkTex = createRoundSparkTexture();

    function createPortal(group) {
      const count = 2000; 
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const life = new Float32Array(count);     
      const angle = new Float32Array(count);
      const speed = new Float32Array(count);    
      
      for(let i=0; i<count; i++) {
        pos[i*3]=0; pos[i*3+1]=0; pos[i*3+2]=0;
        life[i] = Math.random(); 
        angle[i] = Math.random() * Math.PI * 2; 
        speed[i] = 0.9 + Math.random() * 0.2; 
      }
      
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('life', new THREE.BufferAttribute(life, 1));
      geo.setAttribute('angle', new THREE.BufferAttribute(angle, 1));
      geo.setAttribute('speed', new THREE.BufferAttribute(speed, 1));
      
      const mat = new THREE.ShaderMaterial({
        uniforms: { 
          time: { value: 0 }, 
          tex: { value: sparkTex }
        },
        vertexShader: `
          uniform float time; 
          attribute float life; 
          attribute float angle; 
          attribute float speed;
          varying float vAlpha;
          varying float vLife;
          
          void main() {
            float t = mod(life + time * 0.7, 1.0); 
            vLife = t;
            
            float ringRadius = 0.75 + (fract(life * 43758.5453) * 0.15); 
            float rotationSpeed = 6.0;
            float currentAngle = angle + (time * rotationSpeed * speed);
            float r = ringRadius + (t * t * 1.8); 
            
            vec3 p = vec3(cos(currentAngle) * r, 0.0, sin(currentAngle) * r);
            p.y += sin(currentAngle * 5.0 + time * 2.0) * 0.06 * t;

            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_Position = projectionMatrix * mv;
            
            gl_PointSize = (10.0 / -mv.z) * (1.0 - t * 0.6); 
            vAlpha = 1.0 - smoothstep(0.2, 1.0, t); 
          }
        `,
        fragmentShader: `
          uniform sampler2D tex; 
          varying float vAlpha;
          varying float vLife;
          
          void main() {
            vec4 c = texture2D(tex, gl_PointCoord);
            vec3 col = vec3(1.0, 0.95, 0.8);
            if(vLife > 0.5) {
              col = mix(vec3(1.0, 0.9, 0.7), vec3(1.0, 0.6, 0.2), (vLife - 0.5) * 2.0);
            }
            gl_FragColor = vec4(col, c.a * vAlpha);
          }
        `,
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
      });
      
      const mesh = new THREE.Points(geo, mat);
      group.add(mesh);
      return mat;
    }

    nodeData.forEach((d, i) => {
      const y = i * 6; 
      const t = y / height;
      const angle = t * Math.PI * 2 * turns;
      
      const x = Math.cos(angle) * helixRadius;
      const z = Math.sin(angle) * helixRadius;

      const group = new THREE.Group();
      group.position.set(x, y, z);
      
      const portalMat = createPortal(group);
      scene.add(group);
      
      const div = document.createElement('div');
      div.className = 'node-label';
      div.innerHTML = `<div class="sub">${d.s}</div><div class="title">${d.t}</div>`;
      document.getElementById('labels').appendChild(div);

      nodes.push({ group, portalMat, div, y });
    });


    // 5. DE-SYNCED ASCENSION
    const scrollProxy = document.getElementById('scroll-proxy');
    let currentY = 0;
    let targetY = 0;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      const pct = scrollProxy.scrollTop / (scrollProxy.scrollHeight - window.innerHeight);
      targetY = pct * ((nodeData.length-1) * 6); 
      currentY += (targetY - currentY) * 0.08;

      const helixAngle = (currentY / height) * Math.PI * 2 * turns;
      const camOrbit = (helixAngle * 0.7) + (time * 0.05); 
      const camDist = 11.0; 
      
      camera.position.x = Math.cos(camOrbit) * camDist;
      camera.position.z = Math.sin(camOrbit) * camDist;
      camera.position.y = currentY + 3.0;
      camera.lookAt(0, currentY + 3.0, 0);

      starMat.uniforms.time.value = time;
      helixMat.uniforms.time.value = time;
      
      nodes.forEach((n) => {
        n.portalMat.uniforms.time.value = time;
        n.group.updateMatrixWorld();
        
        const vec = new THREE.Vector3(0, 0, 0);
        vec.applyMatrix4(n.group.matrixWorld);
        vec.project(camera);
        
        const dist = Math.abs(n.y - currentY);
        
        if(dist < 8 && vec.z < 1) {
          const sx = (vec.x * .5 + .5) * window.innerWidth;
          const sy = (-(vec.y * .5) + .5) * window.innerHeight;
          n.div.style.left = `${sx}px`;
          n.div.style.top = `${sy}px`;
          n.div.classList.add('visible');
          
          const scale = 1 - (dist/8);
          n.div.style.transform = `translate(-50%, -100%) scale(${0.8 + 0.2*scale})`;
          n.div.style.opacity = Math.max(0, scale);
        } else {
          n.div.classList.remove('visible');
        }
      });

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
